# Basic access control
rocommunity public default

# Spoofing standard HP Workstation System Description
sysdescr "HP Z2 Mini G9 Workstation; Windows 11 Enterprise / Ubuntu Workstation Host"
sysobjectid .1.3.6.1.4.1.11.2.23

# Injecting Simulated HP Hardware MIB Entries (OIDs are examples within HP's branch)
# Syntax: override OID TYPE VALUE
override .1.3.6.1.4.1.11.2.23.1.1.1.0 string "HP Z2 Mini G9 SFF"     # Model Name
override .1.3.6.1.4.1.11.2.23.1.2.1.0 string "CZW2026LAB1"          # Mock Serial Number
override .1.3.6.1.4.1.11.2.23.2.1.1.0 integer 2                     # Thermal Status (2 = OK, 3 = Degraded, 4 = Critical)
override .1.3.6.1.4.1.11.2.23.2.5.1.0 integer 28                    # CPU Temperature in C
